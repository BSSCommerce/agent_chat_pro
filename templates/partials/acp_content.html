<div id="acp-app"
     class="acp-shell flex min-h-[calc(100vh-3rem)] flex-col rounded-3xl border shadow-sleek-lg transition-colors"
     style="background: var(--acp-bg); border-color: var(--acp-border); color: var(--acp-text);"
     data-agents='{{ agent_options | tojson }}'
     data-preference='{{ preference | tojson }}'
     data-viewer='{{ viewer | tojson }}'>
    <div class="flex min-h-0 flex-1 flex-col p-3 lg:p-4">
        <div id="acp-main-layout" class="grid min-h-[420px] flex-1 grid-cols-1 gap-3 h-[calc(100vh-5.5rem)] max-h-[calc(100vh-4.5rem)] xl:grid-cols-[320px_minmax(0,1fr)]">
            {% include "partials/acp_sidebar.html" %}
            {% include "partials/acp_chat_main.html" %}
        </div>
    </div>

    {% include "partials/acp_fork_modal.html" %}
</div>
