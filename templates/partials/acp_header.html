        <header class="flex flex-col gap-4 rounded-2xl border p-4 shadow-sm md:flex-row md:items-end md:justify-between"
                style="background: var(--acp-panel); border-color: var(--acp-border);">
            <div class="min-w-0 md:pr-4">
                <div class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold"
                     style="background: var(--acp-accent-soft); color: var(--acp-accent);">
                    Single Agent Workspace
                </div>
                <h1 class="mt-3 text-2xl font-semibold tracking-tight">Agent Chat Pro</h1>
                <p class="mt-1 max-w-2xl text-sm" style="color: var(--acp-muted);">
                    Chat with one visible agent, keep every conversation as a retrievable thread, and continue exactly where you left off.
                </p>
            </div>
            <div class="w-full min-w-0 md:max-w-md md:flex-shrink-0">
                <span id="acp-agent-label" class="mb-1 block text-xs font-semibold uppercase tracking-wide" style="color: var(--acp-muted);">Default agent</span>
                <div class="flex items-end gap-2">
                    <select id="acp-agent-select"
                            aria-labelledby="acp-agent-label"
                            class="min-h-[2.5rem] min-w-0 flex-1 rounded-xl border px-3 py-2 text-sm outline-none transition focus:ring-4"
                            style="border-color: var(--acp-border); background: var(--acp-panel-soft); color: var(--acp-text); --tw-ring-color: color-mix(in srgb, var(--acp-accent) 25%, transparent);">
                        <option value="">Select an agent</option>
                        {% for agent in agent_options %}
                        <option value="{{ agent.alias }}">{{ agent.name }} ({{ agent.alias }})</option>
                        {% endfor %}
                    </select>
                    <button id="acp-theme-toggle"
                            type="button"
                            class="acp-theme-toggle"
                            aria-label="Switch color theme"
                            title="Switch theme">
                        <span id="acp-theme-icon-moon" class="inline-flex" aria-hidden="true">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                            </svg>
                        </span>
                        <span id="acp-theme-icon-sun" class="hidden inline-flex" aria-hidden="true">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                        </span>
                    </button>
                    <button id="acp-fullscreen-toggle"
                            type="button"
                            class="acp-theme-toggle"
                            aria-label="Enter full screen"
                            title="Full screen">
                        <span id="acp-fullscreen-icon-enter" class="inline-flex" aria-hidden="true">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M8 4H4v4m12-4h4v4M8 20H4v-4m12 4h4v-4" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M9 9L4 4m11 5l5-5M9 15l-5 5m11-5l5 5" />
                            </svg>
                        </span>
                        <span id="acp-fullscreen-icon-exit" class="hidden inline-flex" aria-hidden="true">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M9 4v5H4m11-5v5h5M9 20v-5H4m11 5v-5h5" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M9 9l-5-5m11 5l5-5M9 15l-5 5m11-5l5 5" />
                            </svg>
                        </span>
                    </button>
                </div>
            </div>
        </header>
